<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .blk  { fill: #0f1a2e; stroke: #2a3b5c; stroke-width: 1.5; }
      .blk.g { stroke: #34d399; }
      .link { stroke: #34d399; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.4s linear infinite; }
      .lbl  { fill: #8aa0c4; font-size: 11px; letter-spacing: 1.5px; }
      .hash { fill: #e2e8f0; font-size: 13px; }
      .sig  { fill: #22d3ee; font-size: 11px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- Left: identity -->
  <g class="mono">
    <text x="64" y="92" fill="#34d399" font-size="14" letter-spacing="3">$ ./log_chain.py validate</text>
    <text x="60" y="176" fill="#f8fafc" font-size="64" font-weight="700" letter-spacing="-1">LogSec<tspan fill="url(#accent)">_IDC</tspan></text>
    <text x="64" y="218" fill="#94a3b8" font-size="18">Tamper-evident log vault</text>
    <text x="64" y="244" fill="#94a3b8" font-size="18">encrypted · hash-chained · RSA-signed</text>
    <text x="64" y="300" fill="#34d399" font-size="14">[+] All logs verified OK<tspan class="cursor" fill="#f8fafc"> ▌</tspan></text>
  </g>

  <!-- Right: the chain -->
  <g class="mono" transform="translate(588,96)">
    <!-- links -->
    <line class="link" x1="118" y1="84" x2="152" y2="84"/>
    <line class="link" x1="270" y1="84" x2="304" y2="84"/>
    <line class="link" x1="422" y1="84" x2="456" y2="84"/>

    <!-- genesis -->
    <rect class="blk g" x="0" y="20" width="118" height="128" rx="10"/>
    <text class="lbl" x="14" y="46">GENESIS</text>
    <text class="hash" x="14" y="80">prev = ∅</text>
    <text class="sig" x="14" y="128">anchor</text>

    <!-- block 1 -->
    <rect class="blk" x="152" y="20" width="118" height="128" rx="10"/>
    <text class="lbl" x="166" y="46">LOG #1</text>
    <text class="hash" x="166" y="74">c11f…8241</text>
    <text class="lbl" x="166" y="98">.txt.enc</text>
    <text class="sig" x="166" y="128">✓ RSA-PSS</text>

    <!-- block 2 -->
    <rect class="blk" x="304" y="20" width="118" height="128" rx="10"/>
    <text class="lbl" x="318" y="46">LOG #2</text>
    <text class="hash" x="318" y="74">f8a8…9541</text>
    <text class="lbl" x="318" y="98">.txt.enc</text>
    <text class="sig" x="318" y="128">✓ RSA-PSS</text>

    <!-- block 3 -->
    <rect class="blk" x="456" y="20" width="118" height="128" rx="10"/>
    <text class="lbl" x="470" y="46">LOG #3</text>
    <text class="hash" x="470" y="74">6340…7ba9</text>
    <text class="lbl" x="470" y="98">.txt.enc</text>
    <text class="sig" x="470" y="128">✓ RSA-PSS</text>

    <text x="0" y="196" fill="#64748b" font-size="12">chainₙ = SHA-256( hash(logₙ.enc) ‖ chainₙ₋₁ )</text>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="url(#accent)"/>
</svg>
